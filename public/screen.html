<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hunt for Jeremy — Big Screen</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  html,body { height:100%; overflow:hidden; background:#070910; font-family:system-ui,sans-serif; color:#fff; }
  #c { position:fixed; inset:0; width:100%; height:100%; }
  #hud { position:fixed; inset:0; pointer-events:none; }
  #title { position:absolute; top:20px; left:50%; transform:translateX(-50%); text-align:center; }
  #title h1 { font-size:38px; font-weight:900; letter-spacing:4px; background:linear-gradient(95deg,#ffe07a,#ffd23f 35%,#ff5e3a); -webkit-background-clip:text; background-clip:text; color:transparent; text-shadow:0 2px 14px #0008; filter:drop-shadow(0 2px 10px #ffb13344); }
  #hpwrap { position:absolute; top:84px; left:50%; transform:translateX(-50%); width:min(900px,70vw); }
  .bar { height:32px; border-radius:16px; background:rgba(0,0,0,.6); border:3px solid #ffffff33; overflow:hidden; box-shadow:0 6px 22px #0007, inset 0 1px 3px #0008; }
  #hpfill { height:100%; background:linear-gradient(90deg,#ff2a4d,#ff7a2a); transition:width .15s; box-shadow:inset 0 1px 0 #ffffff44; }
  #hptext { text-align:center; font-weight:800; font-size:18px; letter-spacing:.5px; margin-top:8px; text-shadow:0 1px 5px #000; }
  #qrcard { position:absolute; right:26px; bottom:26px; background:linear-gradient(180deg,#ffffff,#f3eefb); color:#1a1030; border-radius:20px; padding:20px; text-align:center; box-shadow:0 16px 48px #000b, 0 0 0 1px #ffffff22, 0 0 28px #ffd23f33; }
  #qrcard #qr { width:200px; height:200px; image-rendering:pixelated; border-radius:8px; border:4px solid #5a2b8a18; }
  #qrcard .j { font-weight:900; font-size:15px; letter-spacing:2px; margin-bottom:10px; color:#5a2b8a; }
  #qrcard .u { font-weight:800; font-size:18px; margin-top:10px; color:#1a1030; }
  #qrcard .h { font-size:12px; opacity:.65; margin-top:3px; }
  #count { position:absolute; left:26px; bottom:26px; background:linear-gradient(180deg,#ffffff10,#00000080); border:1px solid #ffffff1f; border-radius:16px; padding:15px 22px; font-size:20px; font-weight:900; line-height:1.55; box-shadow:0 10px 30px #0007; text-shadow:0 1px 3px #000; }
  #feed { position:absolute; left:26px; top:154px; width:288px; font-size:16px; }
  #feed div { background:linear-gradient(90deg,#000000a0,#00000055); border-left:3px solid #ffd23f99; padding:6px 12px; border-radius:8px; margin-bottom:6px; font-weight:600; text-shadow:0 1px 3px #000; animation:feedin .25s ease-out; }
  @keyframes feedin { from{opacity:0; transform:translateX(-10px)} to{opacity:1; transform:none} }
  #big { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:14px; background:radial-gradient(circle at 50% 40%,#1d3a1dcc,#0a0e0aee); z-index:5; }
  #big h1 { font-size:76px; font-weight:900; letter-spacing:2px; color:#aaff66; text-shadow:0 3px 20px #000; } #big p { font-size:26px; opacity:.92; text-shadow:0 2px 8px #000; }
  #big .mvp { font-size:32px; font-weight:900; color:#ffd23f; margin-top:10px; } #big .board { font-size:20px; line-height:1.65; opacity:.95; margin-top:8px; }
  #lead { position:absolute; right:26px; top:120px; width:252px; background:linear-gradient(180deg,#00000090,#00000055); border:1px solid #ffffff1f; border-radius:14px; padding:12px 14px; box-shadow:0 10px 30px #0007; display:none; }
  #lead .lh { font-size:13px; font-weight:900; letter-spacing:2.5px; color:#ffd23f; margin-bottom:8px; text-align:center; }
  #lead .lr { display:flex; justify-content:space-between; gap:8px; font-size:16px; font-weight:700; padding:4px 6px; border-radius:7px; }
  #lead .lr:nth-child(2) { background:#ffd23f22; }
  #lead .lr .ln { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; } #lead .lr .lk { color:#ffd23f; font-weight:900; }
  #ballot { position:absolute; left:50%; top:118px; transform:translateX(-50%); display:none; text-align:center; background:linear-gradient(180deg,#1a1233ee,#0a0712ee); border:2px solid #ffd23f66; border-radius:20px; padding:18px 26px; box-shadow:0 16px 48px #000b; }
  #ballot .bt { font-size:26px; font-weight:900; letter-spacing:1px; color:#ffd23f; }
  #ballot .bs { font-size:15px; opacity:.8; margin:4px 0 14px; }
  #ballot .bc { display:flex; gap:16px; justify-content:center; }
  #ballot .bcd { min-width:120px; background:linear-gradient(180deg,#ffffff14,#00000066); border:2px solid #ffffff2e; border-radius:14px; padding:12px 16px; }
  #ballot .bcd .bn { font-size:18px; font-weight:900; } #ballot .bcd .bv { font-size:30px; font-weight:900; color:#ffd23f; }
  #crown { position:fixed; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:10px; background:radial-gradient(circle at 50% 40%,#2a1c40dd,#0a0c14ee); z-index:6; }
  #crown h1 { font-size:66px; font-weight:900; color:#ffd23f; text-shadow:0 3px 22px #000; } #crown p { font-size:26px; opacity:.92; }
  #flash { position:fixed; top:44%; left:50%; transform:translate(-50%,-50%); opacity:0; text-align:center; font-size:62px; font-weight:900; letter-spacing:2px; text-shadow:0 4px 24px #000, 0 0 34px currentColor; z-index:7; pointer-events:none; white-space:nowrap; }
  #flash.show { animation:flashpop 1.7s cubic-bezier(.2,.8,.2,1); }
  @keyframes flashpop { 0%{opacity:0;transform:translate(-50%,-50%) scale(.6)} 12%{opacity:1;transform:translate(-50%,-50%) scale(1.1)} 24%{transform:translate(-50%,-50%) scale(1)} 78%{opacity:1} 100%{opacity:0;transform:translate(-50%,-50%) scale(1.05)} }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div id="title"><h1>HUNT FOR JEREMY</h1><div style="text-align:center;font-weight:900;font-size:17px;letter-spacing:1px;color:#ffd23f;text-shadow:0 2px 8px #000;margin-top:2px">🎂 HAPPY BIRTHDAY, JEREMY! 🎂</div></div>
  <div id="hpwrap"><div class="bar"><div id="hpfill" style="width:100%"></div></div><div id="hptext">King Jeremy</div></div>
  <div id="count">0 attackers<br>0 guards</div>
  <div id="feed"></div>
  <div id="qrcard"><div class="j">SCAN TO JOIN</div><img id="qr" alt="join QR"><div class="u" id="url">...</div><div class="h">or type it into any phone browser</div></div>
  <div id="lead"></div>
  <div id="ballot"></div>
</div>
<div id="big"><h1 id="bigh">JEREMY HAS FALLEN!</h1><p id="bigsub"></p></div>
<div id="crown"><h1>👑 GENERAL CROWNED</h1><p id="crownName"></p></div>
<div id="flash"></div>

<script src="./vendor/qrcode.js"></script>
<script type="module">
import { createWorld } from './scene.js';
import { connect } from './net.js';
import { Sound } from './sound.js';
const $=s=>document.querySelector(s);
const world=createWorld($('#c'), { quality:'high' });
const THREE=world.THREE;
const camera=new THREE.PerspectiveCamera(56, innerWidth/innerHeight, 0.1, 700);

const joinUrl=location.origin+'/'; $('#url').textContent=joinUrl.replace(/^https?:\/\//,'');
try { const qr=qrcode(0,'M'); qr.addData(joinUrl); qr.make(); $('#qr').src=qr.createDataURL(6,8); } catch(e){}

const net=connect({
  roster(m){ world.setRoster(m.players); window._att=m.count; },
  snapshot(m){ world.applySnapshot(m); updateHud(m); renderLead(m); },
  event(ev){
    if(ev.kind==='gameover'){ const win=ev.result==='attackers'; $('#bigh').textContent=win?'JEREMY HAS FALLEN!':'THE CASTLE HELD!'; $('#bigh').style.color=win?'#aaff66':'#ff8866';
      let html=win?'The horde stormed the castle!':'Jeremy survived every round.';
      if(ev.mvp) html+=`<div class="mvp">🏆 MVP: ${ev.mvp.name} — ${ev.mvp.kills} kills</div>`;
      if(ev.board&&ev.board.length) html+='<div class="board">'+ev.board.slice(0,5).map((b,i)=>`${i+1}. ${b.general?'👑 ':''}${b.name} — ${b.kills}k / ${b.deaths}d`).join('<br>')+'</div>';
      html+='<div style="margin-top:16px;color:#ffd23f;font-weight:900;font-size:26px">🎂 Happy Birthday, Jeremy! 🎂</div>';
      $('#bigsub').innerHTML=html; const showOver=()=>{ $('#big').style.display='flex'; Sound[win?'win':'lose'](); }; if(win) setTimeout(showOver, 1900); else showOver(); }   // let the FINAL BLOW moment breathe before the scoreboard
    else if(ev.kind==='victory'){ flash('FINAL BLOW — '+(ev.byName||'A hero')+'!', '#ff3366'); slowmoUntil=performance.now()+1800; Sound.explosion(true); }
    else if(ev.kind==='generals'){ const ns=(ev.names||[]); $('#crownName').textContent=ns.join('  •  ')+' lead the siege!'; $('#crown').querySelector('h1').textContent='👑 GENERALS CHOSEN'; $('#crown').style.display='flex'; setTimeout(()=>$('#crown').style.display='none', 4500); addFeed('👑 Generals: '+ns.join(', ')); Sound.round(); }
    else if(ev.kind==='reset'){ $('#big').style.display='none'; $('#crown').style.display='none'; }
    else if(ev.kind==='round'){ flash('⚔️ ROUND '+ev.round+' — FIGHT!', '#ffd23f'); addFeed('ROUND '+ev.round+' / '+ev.total); Sound.round(); } else if(ev.kind==='intermission'){ addFeed('Intermission - shopping'); Sound.intermission(); }
    else if(ev.kind==='gatebreached'){ addFeed('GATE BREACHED!'); Sound.gateBreach(); } else if(ev.kind==='ramhit'){ addFeed('RAM SMASHES THE GATE!'); Sound.gateHit(); }
    else if(ev.kind==='bought') addFeed('Jeremy bought: '+ev.item);
    else if(ev.kind==='ramdeploy') addFeed('BATTERING RAM DEPLOYED!'); },
});
net.join('screen','TV');
let lastLead=null;
function renderLead(m){ if(m.lead) lastLead=m.lead; const L=$('#lead');
  if((m.phase!=='combat'&&m.phase!=='intermission')||!lastLead||!lastLead.length){ L.style.display='none'; return; }
  L.style.display='block'; L.innerHTML='<div class="lh">TOP HEROES</div>'+lastLead.map(([name,kills,gold,isGen])=>`<div class="lr"><span class="ln">${isGen?'👑 ':''}${name}</span><span class="lk">${kills}</span></div>`).join(''); }

let lastT=performance.now(), slowmoUntil=0;
const flashEl=$('#flash');
function flash(txt,color){ flashEl.textContent=txt; flashEl.style.color=color||'#ffd23f'; flashEl.classList.remove('show'); void flashEl.offsetWidth; flashEl.classList.add('show'); }
function loop(now){ const dt=Math.min(0.05,(now-lastT)/1000); lastT=now; world.update(dt * (now < slowmoUntil ? 0.25 : 1));
  // Side view: camera off the LEFT flank, perpendicular to the lane, so the WHOLE fight (palace -> camp) is visible at once. Gentle sway for life.
  const sway=Math.sin(now/11000)*8; camera.position.set(-124, 66, 8 + sway); camera.lookAt(0, 5, 8 + sway*0.5);
  world.render(camera); requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
function fmt(ms){ const s=Math.ceil(ms/1000); return Math.floor(s/60)+':'+(s%60).toString().padStart(2,'0'); }
function updateHud(m){
  const gateUp = m.gate && m.gate.hp>0;
  const frac = gateUp ? (m.gate.maxHp?m.gate.hp/m.gate.maxHp:0) : (m.king.maxHp?m.king.hp/m.king.maxHp:0);
  $('#hpfill').style.width=Math.max(0,frac*100)+'%';
  $('#hpfill').style.background = gateUp?'linear-gradient(90deg,#b98a3a,#e8cf6a)':'linear-gradient(90deg,#ff2a4d,#ff7a2a)';
  const phaseTxt = m.phase==='combat'?`ROUND ${m.round}/${m.roundsTotal} - ${fmt(m.timeLeft)}`:m.phase==='intermission'?`INTERMISSION - ${Math.ceil(m.timeLeft/1000)}s`:m.phase==='lobby'?'waiting to start':'';
  $('#hptext').textContent=(gateUp?`CASTLE GATE  ${Math.round(m.gate.hp)}/${Math.round(m.gate.maxHp)}`:`KING JEREMY  ${m.king.hp}/${m.king.maxHp}`)+'   -   '+phaseTxt;
  const ramLine = m.ram?'<span style="color:#ffcf33">RAM ROLLING IN!</span>':'building ram';
  $('#count').innerHTML=`${window._att||0} attackers · ${m.king.guards||0} guards<br>Castle ${(m.gold||0)}g · ${(m.towers||[]).length} towers<br>${ramLine} &nbsp;|&nbsp; \u{1FAB5} ${m.wood||0}/${m.woodNeeded||0} \u26cf\ufe0f ${m.iron||0}/${m.ironNeeded||0}`; }
const feed=$('#feed'); const items=[]; function addFeed(t){ items.unshift(t); items.length=Math.min(10,items.length); feed.innerHTML=items.map(x=>`<div>${x}</div>`).join(''); }
addEventListener('resize', ()=>world.resize(innerWidth,innerHeight,camera)); world.resize(innerWidth,innerHeight,camera);
// TV audio: browsers block sound until a user gesture — the operator clicks once to enable. M toggles mute.
addEventListener('pointerdown', ()=>Sound.init(), {once:true});
addEventListener('keydown', e=>{ if(e.key.toLowerCase()==='m') Sound.toggleMute(); });
</script>
</body>
</html>
